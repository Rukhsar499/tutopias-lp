    <style>
        /* Base Reset with New Soft Pastel Orange Canvas */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff3ed; /* Soft Pastel Orange background */
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Abstract Dynamic Background Blobs/Pattern */
        .bg-blob-1 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 87, 34, 0.12) 0%, rgba(255, 87, 34, 0) 70%);
            top: -10%;
            left: -10%;
            z-index: 0;
        }
        .bg-blob-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 193, 7, 0.1) 0%, rgba(255, 193, 7, 0) 70%);
            bottom: -20%;
            right: -10%;
            z-index: 0;
        }

        .thankyou-section {
            width: 100%;
            padding: 40px 15px;
            position: relative;
            z-index: 1;
        }

        /* Premium Minimalist White Glass Card Wrapper */
        .thankyou-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 32px;
            padding: 4.5rem 4rem;
            position: relative;
            box-shadow: 0 30px 60px -20px rgba(230, 74, 25, 0.08), 
                        0 10px 20px -10px rgba(0, 0, 0, 0.02);
        }

        /* Fluid Pattern Accent Strip Inside Card */
        .thankyou-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 8px;
            height: 100%;
            background: linear-gradient(to bottom, #ff5722, #ffb300);
            border-top-left-radius: 32px;
            border-bottom-left-radius: 32px;
        }

        /* Premium Orange Tinted Badge Style */
        .badge-custom {
            background: rgba(255, 87, 34, 0.08);
            color: #d84315; /* Vibrant Deep Pastel Orange */
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            padding: 8px 20px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 87, 34, 0.15);
            text-transform: uppercase;
        }

        /* Elegant High-Contrast Typography */
        .thankyou-title {
            font-size: 4.25rem;
            font-weight: 800;
            color: #1e293b;
            line-height: 1.15;
            margin-bottom: 20px;
            letter-spacing: -1.5px;
        }

        .thankyou-title span {
            color: #ff5722;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .thankyou-text {
            font-size: 1.3rem;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .thankyou-text strong {
            color: #ff5722;
            font-weight: 700;
        }

        /* Clean Minimalist Redirect notice */
        .redirect-notice {
            font-size: 0.9rem;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .spinner-loader {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 87, 34, 0.15);
            border-radius: 50%;
            border-top-color: #ff5722;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Premium Student Transparent Image Interaction */
        .student-hero-img {
            max-height: 400px;
            object-fit: contain;
            filter: drop-shadow(0 20px 35px rgba(255, 87, 34, 0.12));
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .thankyou-card:hover .student-hero-img {
            transform: translateY(-8px) scale(1.02);
            filter: drop-shadow(0 25px 45px rgba(255, 87, 34, 0.18));
        }

        /* Responsive UI Framework overrides */
        @media (max-width: 991.98px) {
            .thankyou-card {
                padding: 4rem 2rem;
                text-align: center;
            }
            .thankyou-card::before {
                width: 100%;
                height: 8px;
                border-top-left-radius: 32px;
                border-top-right-radius: 32px;
                border-bottom-left-radius: 0;
            }
            .thankyou-title {
                font-size: 3.25rem;
            }
            .student-hero-img {
                margin-top: 3.5rem;
                max-height: 320px;
            }
            .redirect-notice {
                justify-content: center;
            }
        }

        @media (max-width: 576px) {
            .thankyou-title {
                font-size: 2.5rem;
            }
            .thankyou-text {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>

<!-- Decorative Ambient Patterns -->
<div class="bg-blob-1"></div>
<div class="bg-blob-2"></div>

<section class="thankyou-section mx-auto">
    <div class="container">
        <div class="thankyou-card" data-aos="fade-up" data-aos-duration="800">
            <div class="row align-items-center">
                
                <!-- LEFT TYPOGRAPHY COLUMN -->
                <div class="col-lg-7 ps-lg-5" data-aos="fade-right" data-aos-delay="200">
                    <div class="badge-custom">Admissions Open 2026-27</div>
                    <h1 class="thankyou-title">
                        Thank you<span>!</span>
                    </h1>
                    <p class="thankyou-text">
                        Thank you for your enquiry.<br>
                        Our team will contact you shortly to guide you on 
                        <strong>fees</strong> and the <strong>admission process</strong>.
                    </p>
                    
                    <!-- Progress Loader Component -->
                    <div class="redirect-notice">
                        <div class="spinner-loader"></div>
                        <span>Redirecting back to home page shortly...</span>
                    </div>
                </div>

                <!-- RIGHT INTERACTIVE IMAGE COLUMN -->
                <div class="col-lg-5 text-center" data-aos="fade-left" data-aos-delay="300">
                    <img src="assets/img/Masters-of-Computer-Applications-.png" alt="Students" class="img-fluid student-hero-img">
                </div>

            </div>
        </div>
    </div>
</section>

<script>
window.addEventListener("load", function () {

    if (localStorage.getItem("downloadBrochure") === "yes") {

        setTimeout(function () {

            const link = document.createElement("a");
            link.href = "assets/img/animation.pdf"; // PDF path
            link.download = "animation.pdf";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            localStorage.removeItem("downloadBrochure");

        }, 2000);

    }

});
</script>

<!-- AOS Script System Initializer -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({
        once: true
    });
</script>
